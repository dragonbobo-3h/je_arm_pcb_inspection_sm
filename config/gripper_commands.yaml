gripper_common:
  force_position_mode: false
  topic: "/end_effector_cmd_lr"
  left_valid: true
  right_valid: false
  wait_for_feedback: true

gripper_commands:
  pick_open:
    mode: torque
    command: open
    torque: 1.0

  pick_close:
    mode: torque
    command: close
    torque: 0.5

  place_open:
    mode: torque
    command: open
    torque: 1.0

  place_close:
    mode: torque
    command: close
    torque: 0.5

  inspect_right_close:
    mode: torque
    command: close
    torque: 0.5
    left_valid: false
    right_valid: true

  inspect_right_open:
    mode: torque
    command: open
    torque: 1.0
    left_valid: false
    right_valid: true

  inspect_left_close:
    mode: torque
    command: close
    torque: 0.5
    left_valid: true
    right_valid: false

  inspect_left_open:
    mode: torque
    command: open
    torque: 1.0

  dual_close:
    mode: torque
    command: close
    torque: 0.5
    left_valid: true
    right_valid: true
    wait_for_feedback: true
